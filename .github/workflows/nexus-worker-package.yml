name: Nexus Worker Package

on:
  pull_request:
    paths:
      - "workers/nexus-worker/**"
      - "components/nexus-worker-enrollment.tsx"
      - "tests/nexus-worker-package.test.mjs"
      - "tests/nexus-worker-bootstrap.test.mjs"
      - "tests/nexus-worker-pairing.test.mjs"
      - "tests/nexus-worker-proof.test.mjs"
      - ".github/workflows/nexus-worker-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-worker-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Validate package contract
        run: node --test tests/nexus-worker-package.test.mjs tests/nexus-worker-bootstrap.test.mjs tests/nexus-worker-pairing.test.mjs tests/nexus-worker-proof.test.mjs
      - name: Assemble worker bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nexus-worker
          MANIFEST="workers/nexus-worker/worker-manifest.json" OUT="dist/nexus-worker" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, "utf8"));
          for (const file of manifest.files) {
            fs.copyFileSync(path.join("workers/nexus-worker", file), path.join(process.env.OUT, file));
          }
          NODE
          chmod +x dist/nexus-worker/start.sh dist/nexus-worker/install.sh dist/nexus-worker/prove.sh
          node dist/nexus-worker/verify.mjs --write-checksums
          node dist/nexus-worker/verify.mjs
      - name: Create and verify archives
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          tar -czf "dist/nexus-worker-${SHORT_SHA}.tar.gz" -C dist nexus-worker
          (cd dist && zip -qr "nexus-worker-${SHORT_SHA}.zip" nexus-worker)
          (
            cd dist
            sha256sum "nexus-worker-${SHORT_SHA}.tar.gz" "nexus-worker-${SHORT_SHA}.zip" > ARCHIVE-SHA256SUMS
            sha256sum -c ARCHIVE-SHA256SUMS
          )
      - name: Upload verified worker package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-worker-${{ github.sha }}
          path: |
            dist/nexus-worker-*.tar.gz
            dist/nexus-worker-*.zip
            dist/ARCHIVE-SHA256SUMS
          if-no-files-found: error
          retention-days: 14
