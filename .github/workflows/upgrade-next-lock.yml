name: Upgrade Next dependency lock

on:
  push:
    paths:
      - ".github/workflows/upgrade-next-lock.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts next@16.3.8 eslint-config-next@16.3.8
      - name: Commit generated lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "fix: update Next.js security patch"
          git push origin HEAD:${GITHUB_REF_NAME}
